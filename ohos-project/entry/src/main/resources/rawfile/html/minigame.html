<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>2048</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c2d;color:#eaf3fa;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}main{height:100dvh;display:flex;align-items:center;justify-content:center;gap:24px;padding:16px}aside{width:190px}h1{font-size:48px;margin:0 0 10px;color:#9bdeef}p{color:#a7bbcd;line-height:1.5;font-size:14px}.stats{background:#20364b;padding:12px;border-radius:10px;margin:10px 0;font-size:16px}b{font-size:24px;display:block}button{border:0;border-radius:9px;padding:12px 18px;background:#34798f;color:white;font-size:16px;cursor:pointer}#board{width:min(70dvh,52vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));flex-shrink:0;gap:8px;padding:8px;background:#273b4e;border-radius:12px;position:relative;touch-action:none;user-select:none}.tile{min-width:0;min-height:0;overflow:hidden;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#344b60;font-size:clamp(19px,5dvh,38px);font-weight:700;transition:background .1s}#status{min-height:45px;color:#a5e8f5;font-weight:bold}button:focus-visible{outline:3px solid #fff}@media(orientation:portrait){main{flex-direction:column;gap:10px}aside{width:min(90vw,440px);display:flex;flex-wrap:wrap;align-items:center;gap:10px}h1{font-size:32px;margin:0}.stats{padding:6px 12px;margin:0}b{font-size:20px}p{margin:0}#board{width:min(90vw,60dvh)}#status{min-height:0;width:100%}}
</style><main><aside><a href="index.html" style="color:#9bdeef">返回</a><h1>2048</h1><div class="stats">分数 <b id="score">0</b></div><button id="restart">重新开始</button><p>滑动屏幕或按方向键<br>合并相同数字，拼出 2048。</p><div id="status" role="status" aria-live="polite"></div></aside><div id="board" role="group" aria-label="2048 棋盘" tabindex="0"></div></main>
<script>
'use strict';
let cells=Array(16).fill(0),score=0,won=false,over=false,start=null;
const board=document.getElementById('board'),status=document.getElementById('status');
const colors={2:'#c7dce0',4:'#a9cbd3',8:'#73b9ca',16:'#4099b4',32:'#287eaa',64:'#5868b4',128:'#8562b6',256:'#a35ca4',512:'#c66d83',1024:'#dc975c',2048:'#e6bd58'};
function add(){const free=[];cells.forEach((v,i)=>{if(!v)free.push(i)});if(free.length)cells[free[Math.floor(Math.random()*free.length)]]=Math.random()<.9?2:4}
function possible(){return cells.some((v,i)=>!v||(i%4<3&&v===cells[i+1])||(i<12&&v===cells[i+4]))}
function draw(){board.replaceChildren();cells.forEach(v=>{const tile=document.createElement('div');tile.className='tile';tile.textContent=v||'';tile.style.background=colors[v]||(v?'#e4ca76':'#344b60');tile.style.color=v&&v<=4?'#223b4c':'#fff';board.appendChild(tile)});document.getElementById('score').textContent=score;over=!possible();status.textContent=over?'没有可移动的方块，重新开始吧！':won?'已达成 2048！可以继续挑战。':''}
function line(ids){const values=ids.map(i=>cells[i]).filter(Boolean),merged=[];for(let i=0;i<values.length;i++){if(i+1<values.length&&values[i]===values[i+1]){const v=values[i]*2;merged.push(v);score+=v;if(v>=2048)won=true;i++}else merged.push(values[i])}while(merged.length<4)merged.push(0);ids.forEach((id,i)=>cells[id]=merged[i])}
function move(direction){if(over)return;const before=cells.slice();for(let n=0;n<4;n++){let ids;if(direction==='left')ids=[0,1,2,3].map(i=>n*4+i);if(direction==='right')ids=[3,2,1,0].map(i=>n*4+i);if(direction==='up')ids=[0,1,2,3].map(i=>i*4+n);if(direction==='down')ids=[3,2,1,0].map(i=>i*4+n);line(ids)}if(cells.some((v,i)=>v!==before[i]))add();draw()}
function reset(){cells=Array(16).fill(0);score=0;won=over=false;start=null;add();add();draw()}
board.addEventListener('pointerdown',e=>{if(start)return;start={x:e.clientX,y:e.clientY,id:e.pointerId};board.setPointerCapture(e.pointerId);e.preventDefault()});
board.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
board.addEventListener('pointercancel',()=>start=null);window.addEventListener('keydown',e=>{const direction={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(direction){e.preventDefault();move(direction)}});document.getElementById('restart').onclick=reset;reset();
</script></html>
